# Snippet di riferimento per nginx (socly.it) — allineato a deploy/demo/.htaccess
#
# Statici SOLO sotto /demo/{10hex}/assets/... (symlink public/assets del core).
# Gli asset degli add-on sono route PHP (/agenzia-entrate/assets/..., ecc.) e
# devono passare da demo/_dispatch.php: NON usare un match generico *.css|*.js
# sotto /demo/{code}/ (rompe il CSS/JS degli add-on sulle demo).

location = /demo/expired.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/plesk/plesk-php84-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/vhosts/socly.it/socly-public/deploy/demo/expired.php;
        fastcgi_param HTTPS on;
}
location ~ "^/demo/([a-f0-9]{10})/(assets/.+\.(css|js|png|jpe?g|gif|webp|svg|ico|woff2?|map))$" {
        set $socly_demo_code $1;
        alias /var/www/vhosts/socly.it/demo/$1/public/$2;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        error_page 404 = @demo_expired;
}
location ~ "^/demo/([a-f0-9]{10})(/.*)?$" {
        set $socly_demo_code $1;
        include fastcgi_params;
        fastcgi_pass unix:/run/plesk/plesk-php84-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/vhosts/socly.it/demo/_dispatch.php;
        fastcgi_param SOCLY_DEMO_CODE $socly_demo_code;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
}
location @demo_expired {
        include fastcgi_params;
        fastcgi_pass unix:/run/plesk/plesk-php84-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/vhosts/socly.it/socly-public/deploy/demo/expired.php;
        fastcgi_param QUERY_STRING code=$socly_demo_code;
        fastcgi_param HTTPS on;
}
